  <h1>Sistema de Matrícula On-line PUCPR</h1>
  <p>Portal do estudante para matrícula, envio de documentos e acompanhamento do processo.</p>

  <h2>Fluxo da matrícula</h2>
  <ul>
    <li>Estudante informa seus dados</li>
    <li>Escolhe o curso</li>
    <li>Envia documentos</li>
    <li>Realiza pagamento</li>
    <li>Sistema valida os dados</li>
    <li>Contrato é gerado</li>
  </ul>
